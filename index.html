<!doctype html>
<!--
    club.hipo.finance now only forwards to the Club on the website (website specs/club-website.md
    §10; club-server specs/club-launch-runbook.md S7a). The old app's source stays in src/ and still
    typechecks and lints, but this page no longer loads it. `git revert` of this change brings the
    app back.

    Everything after the path is carried over byte for byte: the query (Telegram's
    tgWebAppStartParam on a direct link) and the fragment (tgWebAppData, tgWebAppVersion,
    tgWebAppPlatform, tgWebAppThemeParams), which the new page reads from its own location.hash. It
    is cut out of location.href rather than rebuilt from location.search and location.hash, so no
    browser's decoding of either can change a byte.

    location.replace, so the old page leaves no entry in the history. The meta refresh is only for a
    browser without JavaScript; it sits in <noscript> because, outside it, it could fire after the
    script's navigation began and land on /club/ without the fragment.

    public/ (nft/, games/, tonconnect-manifest.json, the icons) is still published unchanged: the
    server's NFT metadata and invoice photo point at it.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hipo Club</title>
        <meta name="robots" content="noindex" />
        <link rel="canonical" href="https://hipo.finance/club/" />
        <link rel="icon" href="/assets/favicon-CxJwN-g6.png" />
        <script>
            ;(function () {
                var href = window.location.href
                var cut = href.search(/[?#]/)
                window.location.replace('https://hipo.finance/club/' + (cut < 0 ? '' : href.slice(cut)))
            })()
        </script>
        <noscript><meta http-equiv="refresh" content="0; url=https://hipo.finance/club/" /></noscript>
      <meta name="build" content="39c034e">
    </head>

    <body style="background-color: #0e0e0e; color: #fff; margin: 0; font-family: sans-serif">
        <p style="padding: 24px; text-align: center">
            Hipo Club has moved to <a href="https://hipo.finance/club/" style="color: #fff">hipo.finance/club</a>.
        </p>
    </body>
</html>
